<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    >
    <title>Каталог товаров</title>
  </head>
  <body>
    <div class="registration">
      <button class="registration__button" type="button">Регистрация</button>
    </div>

    <div class="modal" id="registration-modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal__overlay"></div>
      <div class="modal__content" role="document">
        <button class="modal__close" aria-label="Закрыть модальное окно">×</button>
        <h2 class="modal__title" id="modal-title">Регистрация</h2>
        <form class="registration-form" novalidate>
          <div class="registration-form__group">
            <label class="registration-form__label" for="first-name">Имя</label>
            <input class="registration-form__input"
              id="first-name"
              type="text"
              name="first-name"
              placeholder="Введите имя"
              minlength="2"
              maxlength="50"
              required
              aria-required="true">

            <div class="form-error" id="first-name-error"></div>
          </div>

          <div class="registration-form__group">
            <label class="registration-form__label" for="sur-name">Фамилия</label>
            <input class="registration-form__input"
              id="sur-name"
              type="text"
              name="sur-name"
              placeholder="Введите фамилию"
              minlength="2"
              maxlength="50"
              required
              aria-required="true">
            <div class="form-error" id="sur-name-error"></div>
          </div>

          <div class="registration-form__group">
            <label class="registration-form__label" for="birth-date">Дата рождения</label>
            <input class="registration-form__input"
              id="birth-date"
              type="date"
              name="birth-date"
              required
              aria-required="true">
            <div class="form-error" id="birth-date-error"></div>
          </div>

          <div class="registration-form__group">
            <label class="registration-form__label" for="login">Логин</label>
            <input class="registration-form__input"
              id="login"
              type="text"
              name="login"
              placeholder="Придумайте логин"
              minlength="3"
              maxlength="20"
              required
              aria-required="true">
            <div class="form-error" id="login-error"></div>
          </div>

          <div class="registration-form__group">
            <label class="registration-form__label" for="password">Пароль</label>
            <input class="registration-form__input"
              id="password"
              type="password"
              name="password"
              placeholder="Придумайте пароль"
              minlength="6"
              maxlength="100"
              required
              aria-required="true"
              aria-describedby="password-help">
            <div class="form-help" id="password-help">Минимум 6 символов</div>
            <div class="form-error" id="password-error"></div>
          </div>

          <div class="registration-form__group">
            <label class="registration-form__label" for="repeat-password">Подтверждение пароля</label>
            <input class="registration-form__input"
              id="repeat-password"
              type="password"
              name="repeat-password"
              placeholder="Повторите пароль"
              minlength="6"
              maxlength="100"
              required
              aria-required="true">
            <div class="form-error" id="repeat-password-error"></div>
          </div>

          <button class="registration-form__button" type="submit">
            Зарегистрироваться
          </button>
        </form>
      </div>
    </div>

    <main class="container">
      <div id="catalog-container">
        <h1 class="title catalog-title">Выбери свой продукт</h1>
        <button id="color-toggle-button" class="color-button">Переключать цвет</button>
        <button id="change-color-all-cards">Сменить цвет всех карточек</button>
        <button id="change-color-first-card">Сменить цвет первой карточки</button>
        <button id="open-google">Открыть страницу google.com</button>
        <button id="output-console-log">Вывести сообщение в консоль</button>

        <template id="product-card-template">
          <li class="products__item card">
            <img src="" alt="" class="card__image">
            <span class="card__category"></span>
            <h2 class="card__name"></h2>
            <p class="card__description"></p>
            <span class="card__compound">Состав:</span>
            <div class="card__compound compound">
              <ul class="compound__list"></ul>
            </div>
            <div class="price-row">
              <b class="price-label">Цена:</b>
              <span class="price-value"></span>
            </div>
          </li>
        </template>

        <ul class="products clear-list" id="products-list"></ul>
      </div>
    </main>

    <footer class="footer">
      <div class="footer__container">
        <div class="footer__intro">
          <h3 class="intro__title">Product Cards</h3>
          <p class="intro__description">У нас самые лучшие продукты для кожи!</p>
          <div class="footer__socials">
            <a href="#" class="footer__social-link" aria-label="Telegram">
              <img src="images/telegram.png" alt="Telegram">
            </a>
            <a href="#" class="footer__social-link" aria-label="ВКонтакте">
              <img src="images/vkontakte.png" alt="Vkontakte">
            </a>
          </div>
        </div>

        <form class="footer__form" novalidate>
          <h3 class="form__title">Подпишись на наши акции:</h3>
          <div class="input__group">
            <input
              id="email"
              class="footer__input"
              type="email"
              name="email"
              placeholder="Введи Email..."
              required
              aria-required="true">
            <button class="footer__button" type="submit">Подписаться</button>
          </div>
          <div class="form-error" id="email-error"></div>
        </form>

        <nav class="footer__nav">
          <h3 class="nav__title">Быстрые ссылки</h3>
          <div class="footer__nav-list">
            <a href="#" class="footer__nav-link">Главная</a>
            <a href="#" class="footer__nav-link">Магазин</a>
            <a href="#" class="footer__nav-link">Контакты</a>
          </div>
        </nav>
      </div>

      <div class="footer__bottom">
        <hr class="footer__divider">
        <p class="footer__copyright">© www.product-cards.com. Все права защищены.</p>
      </div>
    </footer>

    <script type="module" src="main.js"></script>
    <script type="module" src="homework-7.js"></script>
    <script type="module" src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
    <script type="module" src="homework-11.js"></script>
    <script type="module" src="products.js"></script>
  </body>
</html>
